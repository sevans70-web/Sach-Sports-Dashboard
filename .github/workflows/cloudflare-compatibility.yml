name: Cloudflare compatibility check

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-compatibility-test]
    paths:
      - '.github/workflows/cloudflare-compatibility.yml'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Check compatibility without changing code or deploying
        run: npx --yes vinext@latest check 2>&1 | tee vinext-check-output.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-check-report
          path: frontend/vinext-check-output.log
          if-no-files-found: warn
