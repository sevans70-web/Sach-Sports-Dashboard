name: Cloudflare compatibility check

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-compatibility-test]
    paths:
      - '.github/workflows/cloudflare-compatibility.yml'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Check compatibility without changing code or deploying
        run: npx --yes vinext@latest check 2>&1 | tee vinext-check-output.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-check-report
          path: frontend/vinext-check-output.log
          if-no-files-found: warn

  workers-dry-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Cloudflare test configuration (runner only)
        run: |
          set -o pipefail
          npx --yes vinext@latest init --platform=cloudflare --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --name=sach-sports-cloudflare-test 2>&1 | tee vinext-init-output.log
      - name: Dry-build Cloudflare Worker (no deploy, no secrets)
        run: |
          set -o pipefail
          npm run build:vinext 2>&1 | tee vinext-build-output.log
      - name: Cloudflare Worker runtime matrix (preview vs dev)
        run: |
          set -u
          for mode in preview dev; do
            echo "==== START $mode ===="
            if [ "$mode" = preview ]; then
              npm run start:vinext -- --host 127.0.0.1 --port 4173 > "vinext-$mode-output.log" 2>&1 &
              port=4173
            else
              npm run dev:vinext -- --host 127.0.0.1 --port 3001 > "vinext-$mode-output.log" 2>&1 &
              port=3001
            fi
            pid=$!
            for attempt in $(seq 1 40); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$port/api/health" || true)
              if [ "$status" != "000" ]; then break; fi
              sleep 1
            done
            for path in /api/health / /nba /nfl /nhl /cfb /cbb; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:$port$path" || true)
              echo "RUNTIME_CHECK mode=$mode path=$path status=$status"
            done
            echo "RUNTIME_BODY mode=$mode:"
            curl -sS -i --max-time 10 "http://127.0.0.1:$port/api/health" | head -c 1600 || true
            echo
            echo "RUNTIME_LOG mode=$mode:"
            tail -40 "vinext-$mode-output.log"
            kill "$pid" 2>/dev/null || true
            sleep 2
          done
      - name: Upload dry-build reports

        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-build-reports
          path: |
            frontend/vinext-init-output.log
            frontend/vinext-build-output.log
            frontend/vinext-preview-output.log
            frontend/vinext-dev-output.log
          if-no-files-found: warn
