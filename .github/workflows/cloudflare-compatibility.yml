name: Cloudflare compatibility check

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-compatibility-test]
    paths:
      - '.github/workflows/cloudflare-compatibility.yml'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Check compatibility without changing code or deploying
        run: npx --yes vinext@latest check 2>&1 | tee vinext-check-output.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-check-report
          path: frontend/vinext-check-output.log
          if-no-files-found: warn

  workers-dry-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Cloudflare test configuration (runner only)
        run: |
          set -o pipefail
          npx --yes vinext@latest init --platform=cloudflare --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --name=sach-sports-cloudflare-test 2>&1 | tee vinext-init-output.log
      - name: Dry-build Cloudflare Worker (no deploy, no secrets)
        run: |
          set -o pipefail
          npm run build:vinext 2>&1 | tee vinext-build-output.log
      - name: Local Worker smoke test (no external account)
        run: |
          set -u
          npm run start:vinext -- --host 127.0.0.1 --port 4173 > vinext-preview-output.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          reachable=""
          for attempt in $(seq 1 30); do
            for port in 4173 8787 3001 3000; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$port/api/health" || true)
              if [ "$status" != "000" ]; then reachable="$port"; break 2; fi
            done
            sleep 1
          done
          if [ -z "$reachable" ]; then
            echo "WORKER_PREVIEW_FAILED: no listening HTTP port"
            tail -100 vinext-preview-output.log
            exit 1
          fi
          echo "LOCAL_PREVIEW_PORT=$reachable"
          fail=0
          for path in /api/health / /nba /nfl /nhl /cfb /cbb; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:$reachable$path" || true)
            echo "SMOKE_TEST path=$path status=$status"
            if [ "$path" = "/api/health" ] && [ "$status" != 200 ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "HEALTH_RESPONSE_BODY:"
            curl -sS -i --max-time 10 "http://127.0.0.1:$reachable/api/health" | head -c 4000 || true
            echo
            echo "PREVIEW_LOG:"
            tail -120 vinext-preview-output.log
            exit 1
          fi
      - name: Upload dry-build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-build-reports
          path: |
            frontend/vinext-init-output.log
            frontend/vinext-build-output.log
            frontend/vinext-preview-output.log
          if-no-files-found: warn
