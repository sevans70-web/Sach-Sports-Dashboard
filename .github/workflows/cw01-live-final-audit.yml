name: CW01 live and final read-only acceptance audit
on:
  push:
    branches: [cloudflare-compatibility-test]
    paths: ['.github/workflows/cw01-live-final-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Trace actual Q1 cards through public visibility and positive EV
        shell: bash
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund --silent
          node --input-type=module <<'NODE'
          import {loadTs} from './frontend/tests/load-ts.mjs';
          const {integrityRow}=await loadTs(new URL('./frontend/lib/prop-integrity.ts',import.meta.url));
          const {publicNbaRanking}=await loadTs(new URL('./frontend/lib/public-card-metrics.ts',import.meta.url));
          const {nbaCardEv}=await loadTs(new URL('./frontend/lib/nba-ev-ranking.ts',import.meta.url));
          const {estimatedEv,nbaComparisonEv}=await loadTs(new URL('./frontend/lib/estimated-ev.ts',import.meta.url));
          const {scopedNbaBoard,nbaFixtureDay}=await loadTs(new URL('./frontend/lib/nba-slate-scope.ts',import.meta.url));
          const base='https://sach-sports-cloudflare-test.sevans70.workers.dev';
          const today=nbaFixtureDay(new Date());
          for(const market of ['q1_points','q1_rebounds','q1_assists']){
            const url=base+'/api/nba/rankings?market='+market+'&calendar='+today;
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(60000)});
              const data=await response.json();
              const scoped=scopedNbaBoard(data,market,today);
              const normalized=scoped.rows.map(r=>integrityRow(r,'nba',market));
              const visible=normalized.filter(r=>publicNbaRanking(r));
              const positive=visible.filter(r=>nbaCardEv({raw:r})!=null);
              const rawPositive=normalized.filter(r=>nbaCardEv({raw:r})!=null);
              const sameDay=data.rows.filter(r=>nbaFixtureDay(r.gameTime)===today).length;
              const reasons={};
              for(const r of visible.filter(r=>nbaCardEv({raw:r})==null)) {
                const key=String(r.researchForecast?.selectionReason||r.researchForecast?.reason||r.researchForecast?.status||'none');
                reasons[key]=(reasons[key]||0)+1;
              }
              const evReasons={};
              const receiptAudit={frozen:0,capturedBeforeStart:0,forecastBeforeStart:0,forecastSelected:0,milestoneTarget:0,comparison:0};
              for(const r of normalized){
                const result=estimatedEv(r),why=String(result.reason||'available');
                evReasons[why]=(evReasons[why]||0)+1;
                const start=Date.parse(r.gameTime||''),capture=Date.parse(r.forecastCapturedAt||r.boardCapturedAt||''),decision=Date.parse(r.researchForecast?.modelSelection?.calculatedAt||r.researchForecast?.modelTargetForecast?.calculatedAt||'');
                if(r.boardFrozen)receiptAudit.frozen++;
                if(Number.isFinite(start)&&Number.isFinite(capture)&&capture<start)receiptAudit.capturedBeforeStart++;
                if(Number.isFinite(start)&&Number.isFinite(decision)&&decision<start)receiptAudit.forecastBeforeStart++;
                if(r.researchForecast?.modelSelection)receiptAudit.forecastSelected++;
                if(r.researchForecast?.modelTargetForecast)receiptAudit.milestoneTarget++;
                if(nbaComparisonEv(r)!=null)receiptAudit.comparison++;
              }
              console.log('CW01_Q1_FUNNEL '+JSON.stringify({market,http:response.status,apiRows:data.rows?.length,sourceBoardDay:data.boardDay,today,actualFixtureDayRows:sameDay,scoped:scoped.rows.length,verified:normalized.filter(r=>r.quoteVerified).length,public:visible.length,positiveEvBeforePublic:rawPositive.length,positiveEvAfterPublic:positive.length,blockedReasons:reasons,evReasons,receiptAudit,sourceFailures:data.error||null}));
            }catch(error){console.log('CW01_Q1_FUNNEL '+JSON.stringify({market,error:error?.name||String(error)}));}
          }
          NODE
      - name: Check NBA NFL NHL schedules, live game states and settled history
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,json,urllib.request,urllib.error,collections,zoneinfo
          base='https://sach-sports-cloudflare-test.sevans70.workers.dev'
          now=datetime.datetime.now(zoneinfo.ZoneInfo('America/Toronto'))
          print('CW01_AUDIT_TIME '+json.dumps({'toronto':now.isoformat()}))
          routes={}
          for sport in ('nba','nfl','nhl'):
            routes[sport+'-games']='/api/game-slate?sport='+sport+'&scope=calendar'
            routes[sport+'-live']='/api/game-slate?sport='+sport
            routes[sport+'-today']='/api/history/performance?sport='+sport+'&period=Today'
            routes[sport+'-yesterday']='/api/history/performance?sport='+sport+'&period=Yesterday'
            routes[sport+'-week']='/api/history/performance?sport='+sport+'&period=Week'
          routes.update({'nba-previous':'/api/nba/rankings?market=points&day=previous','nba-q1-points':'/api/nba/rankings?market=q1_points','nba-q1-assists':'/api/nba/rankings?market=q1_assists','nba-q1-rebounds':'/api/nba/rankings?market=q1_rebounds'})
          def check(pair):
            name,path=pair
            try:
              req=urllib.request.Request(base+path,headers={'Accept':'application/json','User-Agent':'Sach-CW01-ReadOnly/1.0'})
              with urllib.request.urlopen(req,timeout=65) as response: code=response.status;data=json.load(response)
              o={'route':name,'http':code,'success':data.get('success'),'partial':data.get('partial')}
              if 'games' in name or 'live' in name:
                games=data.get('games') or []
                o['games']=len(games);o['stateCounts']=dict(collections.Counter(str(g.get('state') or g.get('gameState') or g.get('status') or 'unknown') for g in games))
                o['torontoToday']=sum(str(g.get('date') or g.get('startTime') or '')[:10]==now.date().isoformat() for g in games)
                o['withGameId']=sum(bool(g.get('id') or g.get('gameId')) for g in games)
                o['withClock']=sum(bool(g.get('clock')) for g in games)
                o['examples']=[{'id':str(g.get('id') or g.get('gameId') or '')[:24], 'state':str(g.get('state') or g.get('status') or ''),'period':g.get('period'),'clockAvailable':bool(g.get('clock'))} for g in games if str(g.get('state') or '').lower() in ('in','live','post','final')][:3]
              elif 'q1' in name or 'previous' in name:
                rows=data.get('rows') or [];o['rows']=len(rows);o['boardDay']=data.get('boardDay');o['gameDays']=dict(collections.Counter(str(r.get('gameTime') or '')[:10] for r in rows));o['frozen']=sum(bool(r.get('boardFrozen')) for r in rows);o['quoteVerified']=sum(r.get('quoteVerified') is True for r in rows)
              else:
                cov=data.get('coverage') or {};records=data.get('records') or [];o['records']=len(records);o['settled']=sum(str(r.get('status') or '').lower() in ('hit','miss','push','void') for r in records);o['pending']=sum(str(r.get('status') or '').lower()=='pending' for r in records);o['coverageErrors']=len(cov.get('errors') or []);o['sourceDays']=len(cov.get('availableDates') or []);o['historySource']=cov.get('historySource')
              return o
            except Exception as err:return {'route':name,'error':type(err).__name__,'detail':str(err)[:95]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for result in pool.map(check,routes.items()):print('CW01_READONLY '+json.dumps(result,sort_keys=True))
          PY
