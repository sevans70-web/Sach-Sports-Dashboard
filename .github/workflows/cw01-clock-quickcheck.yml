name: CW01 quick live clock verification
on:
  push:
    branches: [cloudflare-compatibility-test]
    paths: ['.github/workflows/cw01-clock-quickcheck.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live score period and time status as ranking cards receive it
        run: |
          python3 - <<'PY'
          import urllib.request,json,re,time,datetime,zoneinfo
          base='https://sach-sports-cloudflare-test.sevans70.workers.dev'
          print('CW01_TIME '+datetime.datetime.now(zoneinfo.ZoneInfo('America/Toronto')).isoformat())
          def fetch(path):
            for attempt in range(3):
              try:
                req=urllib.request.Request(base+path,headers={'Accept':'application/json','User-Agent':'Sach-CW01-ClockCheck/1.0'})
                with urllib.request.urlopen(req,timeout=30) as f:return json.load(f)
              except Exception as e:
                if attempt==2:return {'error':str(e)[:170]}
                time.sleep(2)
          for sport in ['nba','nhl','nfl']:
            data=fetch('/api/game-slate?sport='+sport)
            games=data.get('games') or []
            active=[g for g in games if g.get('state')=='in']
            finals=[g for g in games if g.get('state')=='post']
            detail=[]
            for g in active:
              status=str(g.get('status') or '')
              detail.append({'gameId':g.get('id'),'status':status,'periodInStatus':bool(re.search(r'\\b(?:Q[1-4]|P[1-3]|OT[0-9]*)\\b',status,re.I)),'clockInStatus':bool(re.search(r'\\b[0-9]{1,2}:[0-9]{2}\\b',status)),'scoresPresent':g.get('awayScore') is not None and g.get('homeScore') is not None})
            print('CW01_CLOCK '+json.dumps({'sport':sport,'error':data.get('error'),'total':len(games),'live':len(active),'final':len(finals),'details':detail,'sampleFinals':[{'id':g.get('id'),'status':g.get('status')} for g in finals[:2]]},sort_keys=True))
          PY
