name: NBA Step 3 live markets and featured cards audit
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-compatibility-test]
    paths:
      - '.github/workflows/nba-step3-live-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Confirm every intended NBA tab and single-EV rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path('frontend/components/player-rankings-panel.tsx').read_text()
          markets=page.split('const BASKETBALL: Market[] = [',1)[1].split('];',1)[0]
          props=['points','rebounds','assists','threes_made','pts_rebs_asts','pts_rebs','pts_asts','rebs_asts','steals','blocks']
          missing=[p for p in props if f'key: "{p}"' not in markets]
          assert not missing, 'Missing NBA prop tabs: '+str(missing)
          assert 'key:"first_basket"' in page, 'Missing First Basket'
          assert 'markets:["points","rebounds","assists"].map' in page, 'Q1 PTS/REB/AST tabs missing'
          assert 'key:"q1_threes_made"' not in page, 'Retired Q1 3PM remains visible'
          assert 'nbaDisplayedResearchEv(card.raw)' in page, 'One-sided EV view missing'
          assert 'comparisonEv.over' not in page and 'comparisonEv.under' not in page, 'Dual EV still displayed'
          quotes=Path('frontend/lib/public-card-metrics.ts').read_text()
          assert "row.boardCapturedAt" in quotes, 'Saved Q1 receipt missing'
          print('NBA_STEP3_TABS Verified 10 Props + First Basket + 3 Q1; one EV; original receipts retained')
          PY
      - name: Verify live NBA market and featured-card coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.request,urllib.error,collections
          base='https://sach-sports-cloudflare-test.sevans70.workers.dev'
          markets=['points','rebounds','assists','threes_made','steals','blocks','pts_rebs_asts','pts_rebs','pts_asts','rebs_asts','first_basket','q1_points','q1_rebounds','q1_assists']
          checks=[('rankings:'+m,f'/api/nba/rankings?market={m}') for m in markets]+[('featured','/api/top-plays?sport=nba')]
          def run(item):
            title,path=item
            try:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Accept':'application/json','User-Agent':'Sach-Step3-Audit'}),timeout=50) as resp:
                data=json.load(resp);http=resp.status
              if title=='featured':
                cards=data.get('plays') or []
                return {'test':title,'http':http,'success':data.get('success'),'categories':[{'key':x.get('key'),'hasPick':bool(x.get('pick')),'title':x.get('title')} for x in cards],'day':data.get('slateDay')}
              rows=data.get('rows') or []
              f=lambda r:r.get('researchForecast') or {}
              reasons=collections.Counter(str(f(r).get('reason') or f(r).get('selectionReason') or 'none') for r in rows if not f(r).get('modelSelection') and not f(r).get('modelTargetForecast'))
              return {'test':title,'http':http,'success':data.get('success'),'rows':len(rows),'quoteVerified':sum(r.get('quoteVerified') is True for r in rows),
                'researchAvailable':sum(f(r).get('status')=='available' for r in rows),'modelSelection':sum(bool(f(r).get('modelSelection')) for r in rows),
                'quarterTarget':sum(bool(f(r).get('modelTargetForecast')) for r in rows),
                'headshot':sum(bool(r.get('headshot')) for r in rows),'retained':sum(bool(r.get('quoteRetained')) for r in rows),
                'topMissingReasons':dict(reasons.most_common(3)),
                'missingEv':(data.get('rankingAudit') or {}).get('missingCardFields',{}).get('ev'),
                'probabilityReady':sum(isinstance(f(r).get('priceComparison'),dict) and all(isinstance(f(r)['priceComparison'].get(k),(int,float)) for k in ('overProbability','underProbability','pushProbability')) for r in rows),
                'quoteEvidenceBound':sum(bool((f(r).get('priceComparison') or {}).get('quoteEvidence')) for r in rows),
                'hasDecisionTime':sum(bool((f(r).get('modelSelection') or f(r).get('modelTargetForecast') or {}).get('calculatedAt')) for r in rows),
                'hasForecastCapture':sum(bool(r.get('forecastCapturedAt')) for r in rows),
                'hasBoardCapture':sum(bool(r.get('boardCapturedAt')) for r in rows),
                'priceValidationFailed':sum(f(r).get('giReason')=='price_validation_failed' for r in rows)}
            except urllib.error.HTTPError as e:return {'test':title,'http':e.code,'error':'HTTPError'}
            except Exception as e:return {'test':title,'error':type(e).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            for answer in pool.map(run,checks):print('NBA_STEP3_LIVE '+json.dumps(answer,sort_keys=True))
          PY
