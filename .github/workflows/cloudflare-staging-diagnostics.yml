name: Cloudflare staging live API diagnostics
# Step 3: verify ONLY NBA, NFL, NHL active dashboards, with health and NBA first-basket.
# Archived college, MLB and WNBA data are retained but not actively requested.

on:
  push:
    branches: [cloudflare-compatibility-test]
    paths:
      - '.github/workflows/cloudflare-staging-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe deployed Worker without credentials or writes
        shell: bash
        run: |
          set -u
          base='https://sach-sports-cloudflare-test.sevans70.workers.dev'
          for entry in 'health|/api/health' 'nba-points|/api/nba/rankings?market=points' 'nfl-passing|/api/nfl/rankings?market=passing_yards' 'nhl-shots|/api/nhl/rankings?market=shots_on_goal' 'nba-summary|/api/dashboard-summary?sport=nba' 'nfl-summary|/api/dashboard-summary?sport=nfl' 'nhl-summary|/api/dashboard-summary?sport=nhl' 'nba-tomorrow|/api/nba/rankings?market=points&day=tomorrow' 'nba-first-basket|/api/nba/rankings?market=first_basket' 'nba-rebounds|/api/nba/rankings?market=rebounds' 'nba-threes|/api/nba/rankings?market=threes_made' 'nfl-receiving|/api/nfl/rankings?market=receiving_yards' 'nfl-rushing|/api/nfl/rankings?market=rushing_yards' 'nhl-goals|/api/nhl/rankings?market=goals' 'nhl-saves|/api/nhl/rankings?market=goalie_saves'; do
            label="${entry%%|*}"
            route="${entry#*|}"
            response="$(mktemp)"
            code="$(curl -sS --max-time 55 -o "$response" -w '%{http_code}' "$base$route" || true)"
            bytes="$(wc -c < "$response")"
            # Report only public API structure and availability, never provider payload or credentials.
            python3 - "$label" "$code" "$bytes" "$response" <<'PY'
          import sys,json
          label,code,bytes_,file=sys.argv[1:]
          result={'route':label,'http':code,'responseBytes':int(bytes_)}
          try:
              data=json.load(open(file))
              if isinstance(data,dict):
                  result['success']=data.get('success')
                  if label.endswith('-summary'):
                      result['dashboard']={k:data.get(k) for k in ('games','live','finals','rankedPlayers','playerProps','predictions','estimatedPicks','scheduleAvailable','rankingsAvailable','warning')}
                  result['rows']=len(data['rows']) if isinstance(data.get('rows'),list) else None
                  if isinstance(data.get('rows'),list):
                      import collections
                      rows=data['rows']
                      result['researchModelSelections']=sum(isinstance(r.get('researchForecast'),dict) and isinstance(r['researchForecast'].get('modelSelection'),dict) for r in rows)
                      result['researchAvailable']=sum(isinstance(r.get('researchForecast'),dict) and r['researchForecast'].get('status')=='available' for r in rows)
                      result['researchBlockers']=dict(collections.Counter(str((r.get('researchForecast') or {}).get('reason') or (r.get('researchForecast') or {}).get('selectionReason') or 'no_selection_reason') for r in rows if not (r.get('researchForecast') or {}).get('modelSelection')).most_common(6))
                      result['verifiedQuotes']=sum(r.get('quoteVerified') is True for r in rows)

                  result['fields']=sorted(k for k in ('error','warning','market','source','boardDay','rows') if k in data)
                  if data.get('error'): result['errorType']=str(data['error'])[:100].replace('\\n',' ')
              if label.startswith('nba'):
                  for field in ('boardDay','noQualifyingRows','verifiedPredictions','verifiedQuoteCount','modelSelectionCount','publicRankingCount','boardFrozen','boardUnavailable','excludedUnavailable','researchCount','source'):
                      if field in data: result[field]=data[field]
                  for field in ('warning','feedWarning'):
                      if data.get(field): result[field]=str(data[field])[:170].replace('\\n',' ')
                  if data.get('rankingAudit'): result['rankingAudit']={k:data['rankingAudit'].get(k) for k in ('cards','missingCardFields')}
                  if isinstance(data.get('quoteMatchAudit'),dict): result['quoteMatchAudit']={k:data['quoteMatchAudit'].get(k) for k in ('quotes','fixtures','rosterPlayers','matchedQuotes','quotedRows','pregameRows','integrityVerifiedQuotes','rowsWithLine','fittedForecasts','researchSelections','forecastReasons')}
          except Exception: pass
          print('WORKER_API_STATUS '+json.dumps(result,ensure_ascii=True))
          PY
            rm -f "$response"
          done

      - name: Analyze bounded NBA OWLS points feed without exposing player data
        shell: bash
        run: |
          set -u
          url='https://sach-sports-cloudflare-test.sevans70.workers.dev/api/market-coverage?sport=nba&mode=feed-sample'
          output="$(mktemp)"
          status="$(curl -sS --max-time 40 -o "$output" -w '%{http_code}' "$url" || true)"
          python3 - "$output" "$status" <<'PY'
          import json,sys,collections,datetime
          path,status=sys.argv[1:]
          try:
              data=json.load(open(path))
              games=data.get('games',[])
              stats=collections.Counter()
              categories=collections.Counter()
              samples=[]
              for game in games:
                  stats['fixtures']+=1
                  for book in game.get('books',[]):
                      stats['books']+=1
                      for prop in book.get('props',[]):
                          stats['pointsProps']+=1
                          stamp=prop.get('lastUpdate')
                          try:
                              dt=datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))
                              age=(datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()/60
                              stats['fresh15m' if -1<=age<=15 else 'stale']+=1
                          except Exception: stats['invalidTimestamp']+=1
                          try:
                              line=float(prop.get('line'))
                              stats['validHalfLine' if line>=0 and line*2==int(line*2) else 'invalidLine']+=1
                          except Exception: stats['invalidLine']+=1
                          try:
                              a=float(prop.get('overPrice'));b=float(prop.get('underPrice'))
                              stats['twoSidedPrices' if abs(a)>=100 and abs(b)>=100 else 'invalidPrices']+=1
                          except Exception: stats['invalidPrices']+=1
                          categories[str(prop.get('category'))]+=1
                          if len(samples)<4:
                              samples.append({'fields':sorted(prop.keys()),'category':prop.get('category'),'hasLine':prop.get('line') is not None,'hasPrices':prop.get('overPrice') is not None and prop.get('underPrice') is not None,'hasQuoteTime':bool(prop.get('lastUpdate')),'main':prop.get('isMainLine'),'alternate':prop.get('isAlternate'),'marketStructure':prop.get('marketStructure')})
              report={'http':status,'fixtures':stats['fixtures'],'books':stats['books'],'pointsProps':stats['pointsProps'],'fresh15m':stats['fresh15m'],'stale':stats['stale'],'twoSidedPrices':stats['twoSidedPrices'],'validHalfLine':stats['validHalfLine'],'invalidLine':stats['invalidLine'],'categories':dict(categories),'samples':samples,'error':str(data.get('error',''))[:90]}
              print('NBA_PRIMARY_FEED_STATUS '+json.dumps(report))
          except Exception as e: print('NBA_PRIMARY_FEED_STATUS '+json.dumps({'http':status,'parseError':type(e).__name__}))
          PY
          rm -f "$output"

# Re-run read-only smoke checks after Cloudflare API confirms new active deployments\n# 2026-11-07: confirm NBA, CFB and CBB actual row availability after deploy repair.
