name: Cloudflare staging live API diagnostics
# Re-run after sanitized NFL/CBB provider failure diagnostics deployed to staging.

on:
  push:
    branches: [cloudflare-compatibility-test]
    paths:
      - '.github/workflows/cloudflare-staging-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe deployed Worker without credentials or writes
        shell: bash
        run: |
          set -u
          base='https://sach-sports-cloudflare-test.sevans70.workers.dev'
          for entry in 'health|/api/health' 'nba-points|/api/nba/rankings?market=points' 'nfl-passing|/api/nfl/rankings?market=passing_yards' 'nhl-shots|/api/nhl/rankings?market=shots_on_goal' 'cfb|/api/cfb/rankings-board' 'cbb|/api/cbb/rankings'; do
            label="${entry%%|*}"
            route="${entry#*|}"
            response="$(mktemp)"
            code="$(curl -sS --max-time 55 -o "$response" -w '%{http_code}' "$base$route" || true)"
            bytes="$(wc -c < "$response")"
            # Report only public API structure and availability, never provider payload or credentials.
            python3 - "$label" "$code" "$bytes" "$response" <<'PY'
          import sys,json
          label,code,bytes_,file=sys.argv[1:]
          result={'route':label,'http':code,'responseBytes':int(bytes_)}
          try:
              data=json.load(open(file))
              if isinstance(data,dict):
                  result['success']=data.get('success')
                  result['rows']=len(data['rows']) if isinstance(data.get('rows'),list) else None
                  result['fields']=sorted(k for k in ('error','warning','market','source','boardDay','rows') if k in data)
                  if data.get('error'): result['errorType']=str(data['error'])[:100].replace('\\n',' ')
          except Exception: pass
          print('WORKER_API_STATUS '+json.dumps(result,ensure_ascii=True))
          PY
            rm -f "$response"
          done
