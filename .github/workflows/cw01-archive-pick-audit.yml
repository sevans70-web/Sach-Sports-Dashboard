name: CW01 archived candidates versus qualified picks
on:
  push:
    branches: [cloudflare-compatibility-test]
    paths: ['.github/workflows/cw01-archive-pick-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund --silent
      - name: Inspect only aggregate quote, pick and EV evidence in NBA previous/current slates
        run: |
          node --input-type=module <<'NODE'
          import {loadTs} from './frontend/tests/load-ts.mjs';
          const {estimatedEv,nbaDisplayedResearchEv}=await loadTs(new URL('./frontend/lib/estimated-ev.ts',import.meta.url));
          const {savedModelPick}=await loadTs(new URL('./frontend/lib/saved-model-pick.ts',import.meta.url));
          const {nbaCardEv}=await loadTs(new URL('./frontend/lib/nba-ev-ranking.ts',import.meta.url));
          const base='https://sach-sports-cloudflare-test.sevans70.workers.dev';
          const markets=['points','rebounds','assists','threes_made','pts_rebs_asts','pts_rebs','pts_asts','rebs_asts','steals','blocks','q1_points','q1_rebounds','q1_assists'];
          for(const day of ['previous','today','tomorrow']){
            for(const market of day==='previous'?markets:['points','rebounds','assists','q1_points']){
              try{
                const res=await fetch(base+'/api/nba/rankings?market='+market+'&day='+day,{signal:AbortSignal.timeout(65000)});
                const payload=await res.json(),rows=payload.rows||[];
                const qualified=rows.filter(r=>estimatedEv(r).status==='available'&&estimatedEv(r).percent>0).length;
                const selection=rows.filter(r=>savedModelPick(r,r.market?.startsWith('q1_')&&r.forecastCapturedAt?r.forecastCapturedAt:r.boardCapturedAt)).length;
                const research=rows.filter(r=>nbaDisplayedResearchEv(r)!=null).length;
                const anyPositive=rows.filter(r=>nbaCardEv({raw:r})!=null).length;
                const reasons={};
                for(const r of rows){const ev=estimatedEv(r);if(ev.status!=='available'){reasons[ev.reason]=(reasons[ev.reason]||0)+1}}
                console.log('CW01_ARCHIVE_QUALITY '+JSON.stringify({day,market,http:res.status,boardDay:payload.boardDay,rows:rows.length,frozen:rows.filter(r=>r.boardFrozen).length,quotes:rows.filter(r=>r.quoteVerified).length,modelSelections:selection,strictPositiveEv:qualified,researchOnlyPositiveEv:research,rankableLiveEv:anyPositive,missingEvReasons:reasons}));
              }catch(e){console.log('CW01_ARCHIVE_QUALITY '+JSON.stringify({day,market,error:e.name||String(e)}))}
            }
          }
          NODE
