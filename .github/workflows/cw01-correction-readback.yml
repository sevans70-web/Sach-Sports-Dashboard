name: CW01 official grade correction readback
on:
  push:
    branches: [cloudflare-compatibility-test]
    paths: ['.github/workflows/cw01-correction-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify original November 9 selections versus current read-only Yesterday grades
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://sach-sports-cloudflare-test.sevans70.workers.dev/api/history/performance?sport=nba&period=Yesterday'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Sach-CW01-Correction-Readback'}),timeout=65) as f: body=json.load(f)
          rows=[r for r in body.get('records') or [] if str(r.get('gameId'))=='401909957' and str(r.get('playerName') or '').lower().replace('ć','c')=='nikola jokic' and r.get('market') in ('assists','pts_asts')]
          print('CW01_CORRECTION_READBACK '+json.dumps({'success':body.get('success'),'historyCount':len(body.get('records') or []),'jokic':[{key:r.get(key) for key in ('gameDate','market','pick','line','actual','status','recordSource')} for r in rows]},sort_keys=True))
          PY
