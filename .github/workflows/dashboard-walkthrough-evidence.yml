name: Dashboard walkthrough evidence audit
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-compatibility-test]
    paths: ['.github/workflows/dashboard-walkthrough-evidence.yml', 'frontend/components/player-rankings-panel.tsx']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify NBA Q1 displayed EV eligibility after original quote integrity filtering
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund --silent
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const panel=fs.readFileSync('frontend/components/player-rankings-panel.tsx','utf8');
          assert.ok(panel.includes("if(card.raw?.sport==='nba'&&nbaCardEv(card)!=null)return true;"),'NBA valid EV must bypass old generic projection gate');
          assert.ok(panel.includes("nflSunday?CFB_SLATES"),'Sunday-only NFL time buckets missing');
          assert.ok(panel.includes("label:'Today'"),'Non-Sunday NFL Today slate missing');
          assert.ok(panel.includes('rankingPayload.success === false'),'CW01: failed rankings refresh must preserve last verified cards');
          assert.ok(panel.includes('verifiedPropQuote(card.raw,now,true)'),'CW01: Q1 retention must re-verify original quote');
          assert.ok(panel.includes('Date.parse(card.gameTime)>now'),'CW01: expired pregame Q1 card cannot be revived');
          import {loadTs} from './frontend/tests/load-ts.mjs';
          const {rankNbaCardsByEv}=await loadTs(new URL('./frontend/lib/nba-ev-ranking.ts',import.meta.url));
          const {integrityRow}=await loadTs(new URL('./frontend/lib/prop-integrity.ts',import.meta.url));
          const {publicNbaRanking}=await loadTs(new URL('./frontend/lib/public-card-metrics.ts',import.meta.url));
          const base='https://sach-sports-cloudflare-test.sevans70.workers.dev';
          for(const market of ['q1_points','q1_rebounds','q1_assists']){
           const data=await(await fetch(base+'/api/nba/rankings?market='+market)).json();
           const cleaned=(data.rows||[]).map(r=>integrityRow(r,'nba',market));
           const publicRows=cleaned.filter(r=>publicNbaRanking(r));
           const ranked=rankNbaCardsByEv(publicRows.map(r=>({rank:r.rank,playerId:String(r.playerId),raw:r})));
           console.log('Q1_DISPLAY_DIAG',JSON.stringify({market,apiRows:data.rows?.length,integrityRetained:cleaned.filter(r=>r.quoteVerified).length,publicRows:publicRows.length,positiveEvRanked:ranked.length,topEv:ranked.slice(0,3).map(x=>x.rank)}));
          }
          NODE
      - name: Compare actual upcoming fixture dates and EV eligibility across three sports
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,collections,concurrent.futures,datetime
          root='https://sach-sports-cloudflare-test.sevans70.workers.dev'
          routes={
           'nba-q1-points':'/api/nba/rankings?market=q1_points',
           'nba-q1-rebounds':'/api/nba/rankings?market=q1_rebounds',
           'nba-q1-assists':'/api/nba/rankings?market=q1_assists',
           'nfl-passing':'/api/nfl/rankings?market=passing_yards',
           'nfl-receiving':'/api/nfl/rankings?market=receiving_yards',
           'nfl-rushing':'/api/nfl/rankings?market=rushing_yards',
           'nfl-schedule':'/api/game-slate?sport=nfl&scope=calendar',
           'nfl-week':'/api/nfl/schedule',
           'nba-schedule':'/api/game-slate?sport=nba&scope=calendar',
           'nba-featured':'/api/top-plays?sport=nba',
           'nfl-featured':'/api/top-plays?sport=nfl',
           'nhl-featured':'/api/top-plays?sport=nhl'
          }
          def inspect(item):
           title,path=item
           try:
            with urllib.request.urlopen(urllib.request.Request(root+path,headers={'User-Agent':'Sach-Walkthrough-Evidence'}),timeout=55) as f:
             data=json.load(f);status=f.status
           except Exception as e:return {'route':title,'error':type(e).__name__}
           out={'route':title,'http':status,'success':data.get('success')}
           if isinstance(data.get('games'),list):
            games=data['games'];out['games']=len(games);out['gamesByUtcDay']=dict(collections.Counter(str(g.get('date') or '')[:10] for g in games))
           if isinstance(data.get('rows'),list):
            rows=data['rows'];out['rows']=len(rows);out['rowsByUtcDay']=dict(collections.Counter(str(r.get('gameTime') or '')[:10] for r in rows))
            out['verified']=sum(r.get('quoteVerified') is True for r in rows)
            out['modelSelection']=sum(isinstance((r.get('researchForecast') or {}).get('modelSelection'),dict) for r in rows)
            out['cardFields']={
              'researchOnly':sum(r.get('researchOnly') is True for r in rows),
              'marketBackedFalse':sum(r.get('marketBacked') is False for r in rows),
              'projection':sum(isinstance(r.get('modelProjection'),(float,int)) for r in rows),
              'fallbackModelTarget':sum(isinstance(r.get('modelTarget'),(float,int)) for r in rows),
              'modelProbability':sum(isinstance(r.get('modelProbability'),(float,int)) for r in rows),
              'rawPickPresent':sum(bool(r.get('prediction')) and r.get('prediction')!='—' for r in rows),
              'fittedProjection':sum(isinstance((r.get('researchForecast') or {}).get('projection'),(float,int)) for r in rows),
              'rowHasFixture':sum(bool(r.get('gameId')) and bool(r.get('gameTime')) for r in rows),
              'boardFrozen':sum(r.get('boardFrozen') is True for r in rows),
            }
            eligible=0;values=[]
            for r in rows:
             f=r.get('researchForecast') or {};c=f.get('priceComparison') or {};p=f.get('modelSelection') or f.get('modelTargetForecast') or {}
             side=p.get('side') or ('OVER' if p.get('direction')=='REACHES' else None)
             win=c.get('overProbability') if side=='OVER' else c.get('underProbability') if side=='UNDER' else None
             loss=c.get('underProbability') if side=='OVER' else c.get('overProbability') if side=='UNDER' else None
             odds=p.get('price') or (r.get('overPrice') if side=='OVER' else r.get('underPrice'))
             if not all(isinstance(n,(float,int)) for n in (win,loss,odds)):continue
             profit=odds/100 if odds>0 else 100/abs(odds)
             ev=100*(win*profit-loss)
             if ev>0.05: eligible+=1;values.append(round(ev,1))
            out['approxPositiveSelectedEV']=eligible
            out['approxTopEV']=sorted(values,reverse=True)[:3]
            out['modelReasons']=dict(collections.Counter(str((r.get('researchForecast') or {}).get('reason') or (r.get('researchForecast') or {}).get('selectionReason') or 'none') for r in rows).most_common(5))
           if isinstance(data.get('plays'),list):
            out['featured']=[{'key':p.get('key'),'hasPick':bool(p.get('pick')),'hasTeam':bool(((p.get('pick') or {}).get('row') or {}).get('teamName') or ((p.get('pick') or {}).get('row') or {}).get('team'))} for p in data['plays']]
           return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           for d in pool.map(inspect,routes.items()):print('WALKTHROUGH_EVIDENCE '+json.dumps(d,sort_keys=True))
          PY
